<!doctype html>
{%load static%}
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Lobster&display=swap" rel="stylesheet">
   
     <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
    


    <title>{% block title %} {% endblock %}</title>
    <style>
    
    .header {
    color: #36FF0A;
    font-size: 27px;
    padding: 10px;
    }
    #uniqu{
      border-radius: 20px;
    }
   

    a.navbar-brand {
        font-family:'Lobster',cursive;
        color:aliceblue;

    }
    .white-text{

      color: #fff;
      cursor: pointer;
      text-decoration: italic;
      font-family: "Times New Roman";
    }
    .info-color{
       background-color: rgb(10,110,195);
    } 
    .custom-nav{
        background-color: rgb(0,114,70);
    }
    .nav>li {
   text-align:right;
    }


    
    </style>
    
    <!--yellow-rgb(221,193,43);-->
    
  </head>
  <body>
 <nav class="navbar navbar-expand-lg navbar-dark custom-nav sticky-top">
	<div class="container-fluid" id="amir">
	 <a class="navbar-brand" href="#"><img src="{% static 'registration/hait.png' %}" width="90px" height="60px"></a>
		 <ul class="nav navbar-nav navbar-left">
        <li><img class="pull-left mx-10" src="{% static 'registration/reg.png' %}" width="350px" height="60px"  id="rana1" ></li>
         </ul>
         <div>
        <ul class="nav navbar-nav navbar-right mr-10">
         <li><img class="pull-right" src="{% static 'registration/kada.png' %}" width="80px" height="60px"  id="rana" ></li>
		    </ul>
        {% block navbar%}  {% endblock %} 
         
	</div>
</nav>

{% block body %} {% endblock %}

{% block footer%} {% endblock%}

{% block js %}{% endblock %}

    
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

</html>

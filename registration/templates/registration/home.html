<!-- Material form contact -->

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="well well-sm">
                <form class="form-horizontal" method="post">
                    <fieldset>
                        <h2 id ="uniqu" class="card-header col-md-6 container info-color white-text text-center py-7 "><strong>Visitors E-Contact</strong> </h2>
                       

                        <div class="form-group">
                            
                            <div class="container col-md-5 mt-4">
                                <input id="fname" name="name" type="text" placeholder="First Name" class="form-control">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="container col-md-5 mt-4">
                                <input id="lname" name="name" type="text" placeholder="Last Name" class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                            
                            <div class="container col-md-5 mt-4 ">
                                <input id="email" name="email" type="text" placeholder="Email Address" class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                           
                            <div class="container col-md-5 mt-4">
                                <input id="phone" name="phone" type="text" placeholder="Phone" class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                            
                            <div class="container col-md-5 mt-4">
                                <input id="college" name="college" type="text" placeholder="College/Company" class="form-control">
                            </div>
                        </div>

                       

                        <div class="form-group">
                            <div class="container col-md-5 text-center">
                                <button type="submit" class="btn btn-danger white-text waves-effect waves-light info-color"><strong>Submit</strong></button>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
</div>
<div class=" container footer-copyright text-center py-3">© 2020 Copyright:
    <a href="#"> Developed By Amir Ranabhat and Supervised by Baibhav Bista</a>
  </div>

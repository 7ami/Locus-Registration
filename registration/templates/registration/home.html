<!-- Material form contact -->

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="well well-sm">
                <form class="form-horizontal" name="amirform" id="amirid" method="post">
                    {% csrf_token %}
                    <fieldset>
                        <h2 id ="uniqu" class="card-header col-md-6 container info-color white-text text-center py-7 mt-1"><strong>Visitors E-Contact</strong> </h2>
                       

                        <div class="form-group">
                            
                            <div class="container col-md-5 mt-3">
                                <input id="fname" required name="fname" type="text" placeholder="First Name" class="form-control">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="container col-md-5 mt-3">
                                <input id="lname" required name="lname" type="text" placeholder="Last Name" class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                            
                            <div class="container col-md-5 mt-3 ">
                                <input id="email" name="email" type="text" placeholder="Email Address" class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                           
                            <div class="container col-md-5 mt-3">
                                <input id="phone" name="phone" required type="text" placeholder="Contact Number" class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                            
                            <div class="container col-md-5 mt-3">
                                <input id="college" name="college" required type="text" placeholder="College/Company" class="form-control">
                            </div>
                        </div>

                       

                        <div class="form-group">
                            <div class="container col-md-5 text-center mt-2">
                                <button type="submit" class="btn btn-primary white-text waves-effect waves-light info-color mt-0"><strong>Submit</strong></button>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
</div>




<footer>
    <div class="container py-0">
      <div class="row">
        <div class="col-lg-8 col-md-10 mx-auto">
          <ul class="list-inline text-center">
            <li class="list-inline-item">
              <a href="#" >
                <span class="fa-stack fa-lg">
                  <i class="fas fa-circle fa-stack-2x "></i>

                </span>
              </a>
            </li>
            <li class="list-inline-item ">
              <a href="#" >
                <span class="fa-stack fa-lg ">
                  <i class="fas fa-circle fa-stack-2x "></i>
                  <i class="fab fa-facebook-f fa-stack-1x fa-inverse "></i>
                </span>
              </a>
            </li>
            <li class="list-inline-item">
              <a href="#" >
                <span class="fa-stack fa-lg">
                  <i class="fas fa-circle fa-stack-2x"></i>
                  <i class="fab fa-github fa-stack-1x fa-inverse"></i>
                </span>
              </a>
            </li>
          </ul>
           
        </div>
      </div>
    </div>
  </footer>
